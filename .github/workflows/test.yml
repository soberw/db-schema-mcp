name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        mcp-version: ["==1.25.0", ">=1.25.0,<2"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python -m pip install "$(ls dist/*.whl)[dev]" "mcp${{ matrix.mcp-version }}"

      - name: Show installed MCP SDK version
        run: python -c "from importlib.metadata import version; print('mcp', version('mcp'))"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=db_schema_mcp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
