# db-schema-mcp 配置示例
# 将此文件复制到您想要的位置，并配置您的数据库连接

databases:
  # OceanBase Oracle 兼容模式（安装包已包含纯 Python 驱动）
  oceanbase_oracle:
    type: oceanbase
    host: localhost
    port: 2881  # 直连默认 2881；ODP/OBProxy 常用 2883，按实际端口填写
    user: "app_user@oracle_tenant"
    password: your_password
    database: APP_USER  # Oracle schema；普通名称自动转为大写
    # mode: oracle  # 默认值，可省略；当前仅支持 Oracle 模式
    # 通过 ODP 连接时可用 user: "app_user@oracle_tenant#cluster_name"

  # SQLite 配置
  sqlite_local:
    type: sqlite
    path: /path/to/your/database.db
    # 或使用相对路径: ./data/database.db

  # PostgreSQL 配置
  postgres_production:
    type: postgresql
    host: localhost
    port: 5432
    user: postgres
    password: your_password
    database: production_db
    # 可选: SSL 配置
    # sslmode: require  # disable, allow, prefer, require, verify-ca, verify-full
    # sslrootcert: /path/to/ca.pem

  # MySQL 配置
  mysql_analytics:
    type: mysql
    host: localhost
    port: 3306
    user: your_username
    password: your_password
    database: analytics_db
    # 可选: SSL 配置
    # ssl: true
    # ssl_ca: /path/to/ca.pem
    # ssl_cert: /path/to/cert.pem
    # ssl_key: /path/to/key.pem
    # charset: utf8mb4

  # Oracle 配置
  oracle_erp:
    type: oracle
    host: localhost
    port: 1521
    user: system
    password: your_password
    database: ORCL  # SID 或服务名
    # 可选: 使用 TNS 连接字符串代替 host/port/database
    # dsn: "(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=hostname)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=orcl)))"
